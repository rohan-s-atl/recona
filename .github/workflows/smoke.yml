name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '12 10 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      RECONA_FRONTEND_URL: ${{ secrets.RECONA_FRONTEND_URL }}
      RECONA_BACKEND_URL: ${{ secrets.RECONA_BACKEND_URL }}
      INTERNAL_WORKER_SECRET: ${{ secrets.INTERNAL_WORKER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when smoke URL is not configured
        if: ${{ env.RECONA_FRONTEND_URL == '' }}
        run: echo "Set RECONA_FRONTEND_URL as a repository secret to enable production smoke checks."

      - name: Run smoke checks
        if: ${{ env.RECONA_FRONTEND_URL != '' }}
        run: npm run smoke
